name: IndexNow ping

# Tells Bing (and other IndexNow search engines, which also feed Copilot and
# ChatGPT search) about new or changed pages right after a deploy to main.
on:
  push:
    branches: [main]
    paths:
      - "app/lib/blog-posts.ts"
      - "app/**/page.tsx"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy
        run: sleep 150
      - name: Submit sitemap URLs
        run: |
          URLS=$(curl -s https://ukviralradar.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | head -500)
          JSON=$(printf '%s\n' $URLS | python3 -c 'import sys,json; print(json.dumps({"host":"ukviralradar.com","key":"d6c8add25edcf0fa71048d4070fb5894","keyLocation":"https://ukviralradar.com/d6c8add25edcf0fa71048d4070fb5894.txt","urlList":[l.strip() for l in sys.stdin if l.strip()]}))')
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" -d "$JSON")
          echo "IndexNow response: $code"
          case "$code" in 200|202) exit 0;; *) echo "::warning::IndexNow returned $code"; exit 0;; esac
