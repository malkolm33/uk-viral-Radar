name: Update Product Data

on:
  schedule:
    # Runs at 06:00 UTC every day, which is 06:00 UK time in winter (GMT)
    # and 07:00 UK time in summer (BST) - GitHub Actions cron always runs in
    # UTC and doesn't adjust for UK daylight saving, same as
    # publish-scheduled-posts.yml.
    - cron: "0 6 * * *"
  # Lets you trigger this manually from the Actions tab in GitHub, useful for
  # testing without waiting for the schedule.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update product data in Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: node .github/scripts/update-product-data.mjs
